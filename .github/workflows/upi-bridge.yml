name: Build UPI Bridge APK

on:
  push:
    paths:
      - 'upi-bridge/**'
      - '.github/workflows/upi-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: upi-bridge
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp upi-bridge/app/build/outputs/apk/debug/app-debug.apk Dhanlekh-UPI-Bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dhanlekh-UPI-Bridge-apk
          path: Dhanlekh-UPI-Bridge.apk
          if-no-files-found: error
