name: Build UPI Bridge APK

on:
  push:
    paths:
      - 'upi-bridge/**'
      - '.github/workflows/upi-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: upi-bridge
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp upi-bridge/app/build/outputs/apk/debug/app-debug.apk Dhanlekh-UPI-Bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dhanlekh-UPI-Bridge-apk
          path: Dhanlekh-UPI-Bridge.apk
          if-no-files-found: error

      # keep the built app in the branch as well, so it can be fetched with git
      - name: Commit the APK
        run: |
          mkdir -p upi-bridge/dist
          cp Dhanlekh-UPI-Bridge.apk upi-bridge/dist/Dhanlekh-UPI-Bridge.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f upi-bridge/dist/Dhanlekh-UPI-Bridge.apk
          git commit -m "Build the UPI Bridge APK [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="upi-bridge-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" Dhanlekh-UPI-Bridge.apk \
            --title "Dhanlekh UPI Bridge $TAG" \
            --notes "Install this on the shop phone, paste the address from the ERP, and allow notification access." 
